apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-client
  labels:
    app: inventory-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-client
  template:
    metadata:
      labels:
        app: inventory-client
    spec:
      containers:
        - name: client
          image: inventory-k8s:1.0
          imagePullPolicy: Never
          command: ["python3", "/app/client.py"]
          args: ["--url", "http://inventory:8000/items/keyboard", "--interval", "1"]
